[package]
name = "verify_rust_mutators"
version = "0.1.0"
edition = "2024"

[build-dependencies]
cc="*"

[dependencies]
once_cell = "1.8"
quote = "1.0"
syn = { version = "2.0.90", features = ["full","visit","visit-mut","parsing", "printing","extra-traits"] }
regex = "1.11.1"
tree-sitter = "0.24.5"
tree-sitter-rust = "0.23"
serde_json = "1.0.133"
proc-macro2 = "1.0.92"
rand = "0.8.5"
clap = { version = "4.0", features = ["derive"] }
prettyplease = "0.2"